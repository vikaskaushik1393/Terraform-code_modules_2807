pool: test
stages:
  - stage: plan
    jobs:
      - job: plan
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Pre-Prod'
            backendAzureRmResourceGroupName: 'rg1'
            backendAzureRmStorageAccountName: 'distorage1234'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'key.tfstate.tfstate'